appId: com.itmecasey.imcmail
productName: IMC-Mail
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: IMC-Mail-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
publish:
  provider: github
  owner: ItMeCasey
  repo: IMC-Mail
